<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ConnectHub — a calm social space built around circles, vibes and moments." />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint (font-display: swap keeps text visible meanwhile). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Inter:wght@400..600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Inter:wght@400..600&display=swap" />
    </noscript>
    <title>ConnectHub</title>
    <script>
      // Apply the stored theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var raw = localStorage.getItem('connecthub-theme');
          var pref = raw ? JSON.parse(raw).state.theme : 'system';
          var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          if (dark) document.documentElement.style.setProperty('--boot-bg', '#121110');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Static splash: paints with the HTML (before any JS); React replaces it on mount. -->
    <div id="root">
      <div style="min-height:100dvh;display:grid;place-items:center;background:var(--boot-bg,#faf7f2)" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="48" height="48"><circle cx="16" cy="16" r="10.5" fill="none" stroke="#e8663d" stroke-width="3"/><circle cx="16" cy="16" r="4" fill="#2d5f5d"/></svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
