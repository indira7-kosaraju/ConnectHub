name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server — build & test (JUnit + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers uses the Docker daemon available on ubuntu-latest runners.
      - run: ./mvnw -B clean package
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: server/target/surefire-reports

  client:
    name: Client — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [server, client]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: connecthub
          POSTGRES_USER: connecthub
          POSTGRES_PASSWORD: connecthub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U connecthub" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Start API (dev profile → migrations + seed data)
        working-directory: server
        env:
          SPRING_PROFILES_ACTIVE: dev
          DATABASE_URL: jdbc:postgresql://localhost:5432/connecthub
          CORS_ALLOWED_ORIGINS: http://localhost:4173
          FRONTEND_URL: http://localhost:4173
        run: |
          ./mvnw -B -q -DskipTests package
          nohup java -jar target/connecthub-server.jar > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && exit 0; sleep 2; done
          cat api.log; exit 1

      - name: Install client + browser
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build (same-origin API and WebSocket through the preview proxy)
        working-directory: client
        env:
          VITE_API_URL: ''
          VITE_WS_URL: /ws
        run: npm run build

      - name: Run e2e
        working-directory: client
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
            server/api.log
