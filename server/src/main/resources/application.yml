spring:
  application:
    name: connecthub
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/connecthub}
    username: ${DATABASE_USERNAME:connecthub}
    password: ${DATABASE_PASSWORD:connecthub}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 40MB
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    # 256-bit+ base64 secret. MUST be overridden outside dev.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1jb25uZWN0aHViLWRldi1vbmx5LXNlY3JldA==}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    cookie-secure: ${COOKIE_SECURE:false}
    # Lax works because the SPA reaches the API same-origin (Vite proxy in dev, Vercel rewrite in prod).
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      # Must exactly match an "Authorized redirect URI" in Google Cloud Console.
      redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
  storage:
    local-dir: ${UPLOAD_DIR:./uploads}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false
app:
  rate-limit:
    multiplier: ${RATE_LIMIT_MULTIPLIER:25}
logging:
  level:
    com.connecthub: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
app:
  jwt:
    # No default in prod: startup fails fast if JWT_SECRET is missing.
    secret: ${JWT_SECRET}
    cookie-secure: ${COOKIE_SECURE:true}
logging:
  level:
    root: INFO
    com.connecthub: INFO
